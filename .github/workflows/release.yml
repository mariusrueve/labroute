name: Release
# Push a tag like v1.2.3: tests, builds a universal app, publishes a GitHub
# Release with LabRoute-1.2.3.zip and updates the Homebrew cask in
# mariusrueve/homebrew-tap (needs the TAP_TOKEN repository secret).
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v1.2.3"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          bash scripts/test.sh
          bash scripts/test.sh -c release -Xswiftc -enable-testing -Xswiftc -DDEBUG
      - name: Build universal app
        run: bash scripts/build-app.sh release --universal --version "${{ steps.version.outputs.version }}"
      - name: Package
        id: package
        run: |
          zip="LabRoute-${{ steps.version.outputs.version }}.zip"
          ditto -c -k --keepParent dist/LabRoute.app "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" \
            --title "LabRoute ${{ steps.version.outputs.version }}" --generate-notes
      - name: Check tap token
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [[ -n "$TAP_TOKEN" ]]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::TAP_TOKEN is not set; update the cask in mariusrueve/homebrew-tap by hand."; fi
      - name: Check out tap
        if: steps.tap.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: mariusrueve/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: Update cask
        if: steps.tap.outputs.enabled == 'true'
        working-directory: tap
        run: |
          sed -i '' -E \
            -e 's/^  version ".*"/  version "${{ steps.version.outputs.version }}"/' \
            -e 's/^  sha256 ".*"/  sha256 "${{ steps.package.outputs.sha256 }}"/' \
            Casks/labroute.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "labroute ${{ steps.version.outputs.version }}"
          git push
